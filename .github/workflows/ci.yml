on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

name: CI

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2

jobs:
  check:
    name: Build
    strategy:
      matrix:
        include:
          - rust_version: stable
            run_tests: true
          - rust_version: beta
            run_tests: true
          - rust_version: nightly
            run_tests: true
          # Minimal supported rustc version
          - rust_version: 1.71.0
            run_tests: false
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.rust_version == 'nightly' }}
    env:
      RUST_LOG: warn
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          rustup install ${{ matrix.rust_version }}
          rustup default ${{ matrix.rust_version }}
          rustc --version

      # FAT fixtures can contain large sparse images. Retain registry/git
      # downloads, not target directories or temporary filesystem images.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: false

      - name: Build on MSRV
        if: ${{ !matrix.run_tests }}
        run: cargo build

      - name: Run tests
        run: cargo test --verbose
        if: ${{ matrix.run_tests }}

      - name: Build - no_std
        run: cargo build --no-default-features

      - name: Build - no_std, lfn
        run: cargo build --no-default-features --features lfn

      - name: Build - no_std, alloc, lfn, unicode
        run: cargo build --no-default-features --features alloc,lfn,unicode
